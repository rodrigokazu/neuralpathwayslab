  education1: Hannes Saal leads the Active Touch Laboratory at the University of Sheffield, which studies how the nervous system encodes touch and how we perceive it, using psychophysics, computational modelling and machine learning. He was senior author on FootSim (iScience, 2022), which I built as a postdoc in Sheffield.
