- date: October 2026
  headline: "Nature has accepted our study with Eran Hornstein's group at the Weizmann Institute, \"TDP-43 toxic gain of function links ALS, FTD and Alzheimer's Disease through splicing dysregulation\". [Preprint on bioRxiv](https://doi.org/10.1101/2025.04.20.648873)"

- date: October 2026
  headline: "The [MND Association](https://www.mndassociation.org/research) has awarded me a Non-Clinical Junior Fellowship for \"Uncovering spatially-resolved master controller genes in ALS motor cortex and spinal cord\". With it I am starting my own research programme at SITraN, University of Sheffield, in partnership with the Snyder Lab at Stanford. We will use network controllability to find the few genes that steer each cell type's gene regulatory network in ALS, then locate those genes in motor cortex and spinal cord at single-cell resolution with 10x Atera, which images 18,050 genes in intact tissue. The goal is a short, testable list of candidate treatment targets for motor neurone disease."

