- title: "Transcriptional profiling identifies functional niche-specific TAM subtypes supporting Glioblastoma"
  image: gbm_spatial.png
  description: Machine learning models, including clustering and zero-shot approaches (Novae), applied to Xenium spatial transcriptomics and multiome data from glioblastoma samples. The study identifies distinct tumour-associated macrophage (TAM) subtypes and places them in the tumour microenvironment using NicheCompass.
  authors: Qianqian Zhang, Grant de Jong, Kazu R.S., David Rowitch, Omer Bayraktar
  link:
    url:
