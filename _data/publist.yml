- title: "Transcriptional profiling identifies functional niche-specific TAM subtypes supporting Glioblastoma"
  image: gbm_spatial.png
  description: We applied clustering and the zero-shot Novae models to Xenium spatial transcriptomics and multiome data from glioblastoma. The study identifies tumour-associated macrophage (TAM) subtypes and places them in the tumour microenvironment with NicheCompass.
  authors: Qianqian Zhang, Grant de Jong, Kazu R.S., David Rowitch, Omer Bayraktar
  link:
    url:
    display: In preparation
  highlight: 1

- title: "Spatiotemporally resolved molecular and cellular architecture of spinal cord injury"
  image:
  description: We map the cells of injured mouse and human spinal cord across space and time, combining Xenium spatial transcriptomics with multiome data through optimal transport (the DOT package). The study identifies cell subtypes and their interactions across injury zones.
  authors: Emily R. Burnside, Yeliz Demirci, Jovan Tanevski, Chang Lu, Zoi Katsirea, Kenny Roberts, Guillaume P. Heger, Jimmy Lee, Kazu R.S., Elizabeth Tuck, Julio Saez-Rodriguez, Frank Bradke, Omer Bayraktar
