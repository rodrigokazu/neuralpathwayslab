- title: "TDP-43 toxic gain of function links ALS, FTD and Alzheimer's Disease through splicing dysregulation"
  image: tdp43_splicing.png
  description: In several cohorts, Alzheimer's disease brains with TDP-43 pathology show widespread mis-splicing, and TDP-43 pathology drives production of the APP751 and APP770 isoforms. Cytoplasmic TDP-43 co-sequesters the splicing regulators SCAF11, SRSF5 and TIAL1, which links ALS, FTD and Alzheimer's disease through shared splicing dysfunction.
  authors: Welmoed van Zuiden\*, Thea Meimoun\*, Chen Bar, Aviad Siany, Bar Abarbanel, Lihi Moshe, Nancy S Yacovzada, Emmanuel Amzallag, Aleksandar Rajkovic, Liat Alyagor, Eviatar Weizman, Manuela Neumann, Colin Smith, Karina McDade, Andrew Strange, Rodrigo Siqueira Kazu, Marcel Weinreich, Aron S Buchman, Yanling Wang, David A Bennett, Bingqing Zhao, Lixia Jiang, Joanna Bi, Michael P Snyder, Dmytro Morderer, Jorge Garcia Morato, Wilfried Rossoll, Madison M Reeves, Dennis W Dickson, Mercedes Prudencio, Peter T Nelson, Jonathan D Glass, Adam N Trautwig, Mingee Chung, Zachary T McEachin, Nicholas T Seyfried, Johnathan Cooper-Knock, Eran Hornstein (\*equal contribution)
  link:
    url: https://doi.org/10.1101/2025.04.20.648873
    display: "Accepted at Nature (2026). Preprint: bioRxiv 2025.04.20.648873"
  highlight: 1

- title: "Single-nucleus multiomic atlas of ALS primary motor cortex nominates neuroprotective WDR49-expressing astrocytes"
  image: wdr49_atlas.jpg
  description: We profiled gene expression and chromatin accessibility in single nuclei from the primary motor cortex of 70 donors with sporadic ALS, C9orf72 ALS or no neurological disease. We inferred cell-type-specific gene regulatory networks with scDoRI and tested changes in gene expression, chromatin accessibility and cell composition. The atlas nominates a WDR49-expressing astrocyte population as a candidate protective cell state in ALS.
  authors: Sam Bonsall\*, Rodrigo Kazu Siqueira\*, Marianne King\*, Diana Leung\*, Farah Y Mahiddine, J Robin Highley, Andrew Strange, Yongzhuo Chen, Matilde Sassani, Sara Cabras, Katie M Bowden, Hollie E Wareing, Mahmoud K Eldahshoury, James R Boyne, Mark Collins, Emma Marie Monte, Calum Harvey, Sarah B Gornall, Akanksha Jangid, Connie Treanor, Tobias Moll, Charlotte H van Dijk, Yiliang Huang, Alex E Urban, Pamela J Shaw, Ryan J H West, Kevin P Kenna, Eran Hornstein, Sai Zhang, Johnathan Cooper-Knock, Jingtian Zhou, Michael P Snyder (\*equal contribution)
  link:
    url: https://www.researchsquare.com/article/rs-9853460/v1
    display: "In revision, Nature Neuroscience. Preprint: Research Square rs-9853460"
  highlight: 1

- title: "Spatially resolved TDP-43 pathology in amyotrophic lateral sclerosis links to neuroprotective cathepsin D activity"
  image: spinal_cord_xenium.jpg
  description: We used 10x Xenium (480-gene panel) to profile 770,000 cells in spinal cord sections from 20 donors with sporadic ALS, C9orf72 ALS or no neurological disease, and scored each motor neuron for TDP-43 pathology on a pTDP-43 stain of the same section. Within ALS sections, motor neurons with TDP-43 pathology carry about 1.5 times more cathepsin D (CTSD) transcripts than motor neurons of the same size without it, and rare damaging CTSD variants raise ALS risk.
  authors: Rodrigo Kazu Siqueira\*, Marcel Weinreich\*, ..., Johnathan Cooper-Knock, Michael P. Snyder (\*joint first authors, final author list to follow)
  link:
    url:
    display: In preparation
  highlight: 1

- title: "Selective pruning and neuronal death generate heavy-tailed network connectivity"
  image: netn_fig1f.png
  description: A directed network model that selectively deletes less-connected nodes and edges produces heavy-tailed degree distributions without fine-tuning. This suggests that pruning of neurons and synapses during brain development is selective, and that preferential detachment, like preferential attachment, can generate heavy-tailed networks.
  authors: Kazu RS, Neves K and Mota B
  link:
    url: https://arxiv.org/abs/2408.02625
    display: "Submitted to Network Neuroscience (2026). Preprint: arXiv:2408.02625"
  highlight: 1

- title: "Single-nucleus regulatory mapping reveals drivers of oligodendrocyte and OPC dysfunctional states in Alzheimer's disease"
  image:
  description: We combine multi-region single-nucleus RNA and chromatin accessibility data from human brain to map oligodendrocyte and oligodendrocyte progenitor cell (OPC) states in Alzheimer's disease, and infer the gene regulatory programmes that drive them.
  authors: Chagas P, De Felice FG, Ferreira ST, Ribeiro FC, Mota B, Kazu RS and Lourenço MV (Kazu RS and Lourenço MV co-corresponding)
