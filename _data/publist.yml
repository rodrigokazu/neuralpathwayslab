- title: "Spatiotemporally resolved molecular and cellular architecture of spinal cord injury"
  image:
  description: Spatiotemporal cellular and molecular architecture of spinal cord injury mapped using Xenium spatial transcriptomics and multiome integration with optimal transport (DOT package) in mouse and human samples. Identifies distinct cellular subtypes and their interactions across injury zones.
  authors: Emily R. Burnside, Yeliz Demirci, Jovan Tanevski, Chang Lu, Zoi Katsirea, Kenny Roberts, Guillaume P. Heger, Jimmy Lee, Kazu R.S., Elizabeth Tuck, Julio Saez-Rodriguez, Frank Bradke, Omer Bayraktar
