- title: "Modeling foot sole cutaneous afferents: FootSim"
  image: footsim.png
  description: FootSim is a realistic computational model of mechanoreceptor activation in the lower limb. It simulates neural spiking responses to arbitrary mechanical stimuli from all four types of mechanoreceptors innervating the foot sole, fitted to human microneurography recordings. The project won the INSIGNEO prize for best research.
  authors: Katic N, Kazu RS, Cleland L, ..., Bent L, Raspopovic S and Saal PH
  link:
    url: https://www.cell.com/iscience/fulltext/S2589-0042(22)02147-2?
    display: iScience, Vol. 26, Issue 1 (January 2023), 23 citations
  highlight: 1

- title: "White matter volume and white/gray matter ratio in mammalian species as a consequence of the universal scaling of cortical folding"
  image: pnas_white_matter.png
  description: Postulates that relative white matter volume is determined as the developing cortex settles in the most energetically favourable folded conformation, regardless of its number of neurons.
  authors: Mota B, Dos Santos SE, Ventura-Antunes L, Neves K, Kazu RS, Herculano-Houzel S.
  link:
    url: https://www.pnas.org/doi/full/10.1073/pnas.1716956116
    display: PNAS, Vol. 116, No. 30 (2019), 68 citations
  highlight: 1

- title: "Cellular scaling rules for the brain of Artiodactyla include a highly folded cortex with few neurons"
  image:
  description: Scaling rules found across modern afrotherians, glires, and artiodactyls applied to the common Eutherian ancestor. The distribution of neurons along the cortical surface, related to gyrification, appears to be a clade-specific characteristic.
  authors: Kazu RS, Maldonado J, Mota B, Menger PR, Herculano-Houzel S.
  link:
    url: https://www.frontiersin.org/articles/10.3389/fnana.2014.00128/full
    display: Frontiers in Neuroanatomy, Vol. 8 (2014), 56 citations
  highlight: 0
