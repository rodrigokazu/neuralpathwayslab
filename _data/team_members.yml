- name: Dr Rodrigo Kazu Siqueira
  photo: Rodrigo.png
  info: Research Associate, Sheffield Institute for Translational Neuroscience (SITraN), University of Sheffield / Snyder Lab, Stanford University.
  email: r.siqueiradesouza@sheffield.ac.uk
  number_educ: 1
  education1: I am a computational biologist working at the intersection of single-cell multiomics, spatial transcriptomics, and complex network theory, with a focus on ALS/MND. I am currently a Research Associate in the Cooper-Knock group at SITraN, University of Sheffield, embedded within the Snyder Lab at Stanford University. I lead the analysis of the largest ALS single-cell multiome atlas to date (788,330 cells, motor cortex) and am generating the first ALS motor cortex spatial transcriptomics dataset on the 10x Genomics Xenium platform. I develop network controllability methods — Minimum Dominating Sets — to prioritise master regulators and therapeutic targets from gene regulatory networks in disease-relevant cell types. Previously I was a Post-doctoral Fellow at the Wellcome Sanger Institute, University of Cambridge (Bayraktar lab, 2024–2025), where I worked on glioblastoma spatial transcriptomics. I have a PhD in Cybernetics (University of Reading, 2020), an MSc in Neuroscience (Federal University of Rio de Janeiro), and a BSc in Biological Sciences (Federal University of Rio de Janeiro).
