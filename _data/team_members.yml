- name: Dr Rodrigo Kazu Siqueira
  photo: Rodrigo.png
  info: MND Association Non-Clinical Junior Fellow, Sheffield Institute for Translational Neuroscience (SITraN), University of Sheffield, and Snyder Lab, Stanford University.
  email: r.siqueiradesouza@sheffield.ac.uk
  number_educ: 1
  education1: I am a computational biologist who uses single-cell multiomics, spatial transcriptomics and network science to study ALS/MND. I am an MND Association Non-Clinical Junior Fellow at SITraN, University of Sheffield, where I lead a programme on master controller genes in ALS, working with the Cooper-Knock group and the Snyder Lab at Stanford University. I am joint first author on the largest ALS single-cell multiome atlas to date (788,330 nuclei from motor cortex, in revision at Nature Neuroscience) and on a 10x Xenium study of TDP-43 pathology in ALS spinal cord, and a co-author of a TDP-43 splicing study accepted at Nature. With the fellowship we will map controller genes in ALS motor cortex and spinal cord with 10x Atera. I develop network controllability methods (minimum dominating sets) to prioritise candidate regulators and therapeutic targets in disease-relevant cell types. Previously I was a Post-doctoral Fellow at the Wellcome Sanger Institute in Cambridge (Bayraktar group, 2024 to 2025), where I worked on spatial transcriptomics of glioblastoma and spinal cord injury. I have a PhD in Cybernetics (University of Reading), an MSc in Neuroscience and a BSc in Biological Sciences (both Federal University of Rio de Janeiro).
