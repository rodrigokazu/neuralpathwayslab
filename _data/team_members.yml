  education1: Paulo has a BSc in Biophysics from the Federal University of Rio de Janeiro (UFRJ). He is currently a Masters student in Applied Physics at the University of Brazil, co-supervised by Rodrigo Kazu and Bruno Mota. His project focuses on multiomics of Alzheimer's disease — "Understanding oligodendrocyte dysfunction in Alzheimer's disease" — using datasets from the Kellis group at MIT.
