- title: "Understanding oligodendrocyte dysfunction in Alzheimer's disease"
  image:
  description: Co-supervising a Master's student at the Applied Physics program, University of Brazil, on a multiomics project examining oligodendrocyte dysfunction in Alzheimer's disease using the latest dataset from the Kellis group (MIT). The project applies single-cell and multiome approaches to characterise glial cell-type-specific transcriptional changes in AD.
