- title: "Glioblastoma tumour-associated macrophages (Xenium)"
  image: gbm_spatial.png
  description: In collaboration with the Bayraktar lab (Wellcome Sanger Institute) and the Zhang laboratory (University of Florida), I apply machine learning models — including clustering and zero-shot models from the Novae package — to Xenium spatial transcriptomics and multiome data from glioblastoma samples. I identify distinct tumour-associated macrophage (TAM) subtypes and their spatial localisation within the tumour microenvironment, with the aid of NicheCompass for cellular niche computation. Manuscript in preparation for Nature.
  interested: Rodrigo Kazu Siqueira, Qianqian Zhang, Grant de Jong, David Rowitch, Omer Bayraktar.
  link:
    url: https://www.sanger.ac.uk/group/bayraktar-group/
    display: Bayraktar group, Wellcome Sanger Institute
  highlight: 1

- title: "Spatiotemporal spinal cord injury atlas"
  image:
  description: I contribute to a large-scale spatiotemporal analysis of spinal cord injury using Xenium spatial transcriptomics and multiome integration with optimal transport (DOT package). The work identifies distinct cellular subtypes and their interactions across injury zones in both murine and human samples, providing new insights into potential therapeutic targets for spinal cord repair. Manuscript in preparation for Cell (Burnside et al.).
  interested: Emily R. Burnside, Rodrigo Kazu Siqueira, Yeliz Demirci, Julio Saez-Rodriguez, Frank Bradke and collaborators.
