- title: "Transcriptional profiling identifies functional niche-specific TAM subtypes supporting Glioblastoma"
  image: gbm_spatial.png
  description: With the Bayraktar group at the Wellcome Sanger Institute, I applied clustering and the zero-shot Novae models to 10x Xenium spatial transcriptomics and multiome data from glioblastoma, and used NicheCompass to place tumour-associated macrophage (TAM) subtypes in their tumour niches. The study is led by Qianqian Zhang and Omer Bayraktar and the manuscript is in preparation.
  interested: Qianqian Zhang (lead), Grant de Jong, Rodrigo Kazu Siqueira, David Rowitch, Omer Bayraktar.
