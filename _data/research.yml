- title: "Spatiotemporally resolved molecular and cellular architecture of spinal cord injury"
  image:
  description: An atlas of spinal cord injury mapping molecular and cellular architecture across space and time in mouse and human tissue. An integrated single-cell transcriptomic atlas (167,493 cells, 18 broad cell types) is projected onto 10x Visium spatial transcriptomics sections from mice at 1, 3, 7, 14 and 28 days after contusion injury using Cell2location. Cell-cell communication is inferred with MISTy and LIANA, revealing spatiotemporal tissue zonation (including distinct fibrotic core, glial scar and spared grey matter compartments) and fine-grained macrophage and microglia subtype dynamics throughout the injury response. The study is led by Emily Burnside with Frank Bradke and Omer Bayraktar, I contributed Xenium analysis, and the manuscript is in preparation.
  interested: Emily R. Burnside, Yeliz Demirci, Jovan Tanevski, Chang Lu, Zoi Katsirea, Kenny Roberts, Guillaume P. Heger, Jimmy Lee, Rodrigo Kazu Siqueira, Elizabeth Tuck, Julio Saez-Rodriguez, Frank Bradke, Omer Bayraktar.
