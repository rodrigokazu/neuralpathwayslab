- title: "Transcriptional profiling identifies functional niche-specific TAM subtypes supporting Glioblastoma"
  image: gbm_spatial.png
  description: In collaboration with the Bayraktar lab (Wellcome Sanger Institute), I apply machine learning models (including clustering and zero-shot models from the Novae package) to Xenium spatial transcriptomics and multiome data from glioblastoma samples. I identify distinct tumour-associated macrophage (TAM) subtypes and their spatial localisation within the tumour microenvironment, with the aid of NicheCompass for cellular niche computation. Manuscript in preparation for Nature.
  interested: Rodrigo Kazu Siqueira, Grant de Jong, David Rowitch, Omer Bayraktar.
  link:
    url: https://www.sanger.ac.uk/group/bayraktar-group/
    display: Bayraktar group, Wellcome Sanger Institute
  highlight: 1

- title: "Spatiotemporally resolved molecular and cellular architecture of spinal cord injury"
  image:
  description: An atlas of spinal cord injury mapping molecular and cellular architecture across space and time in both mouse and human tissue. An integrated single-cell transcriptomic atlas (167,493 cells, 18 broad cell types) is projected onto 10x Visium spatial transcriptomics sections from mice at 1, 3, 7, 14 and 28 days post-contusion injury using Cell2location. Cell-cell communication is inferred with MISTy and LIANA, revealing spatiotemporal tissue zonation (including distinct fibrotic core, glial scar, and spared grey matter compartments) and fine-grained macrophage and microglia subtype dynamics throughout the injury response. Manuscript in preparation for Cell.
  interested: Emily R. Burnside, Yeliz Demirci, Jovan Tanevski, Chang Lu, Zoi Katsirea, Kenny Roberts, Guillaume P. Heger, Jimmy Lee, Rodrigo Kazu Siqueira, Elizabeth Tuck, Julio Saez-Rodriguez, Frank Bradke, Omer Bayraktar.
