  highlight: 1

- title: "scController: network controllability for single-cell and spatial omics"
  image: mds_network.png
  description: As part of the MNDA fellowship project, I am developing scController, an open-source Python toolbox for applying Minimum Dominating Set analysis to eGRNs and spatial cell-type co-occurrence networks derived from single-cell and spatial omics data. The package will be integrated into the scverse ecosystem and benchmarked against state-of-the-art hub-extraction methods, complemented by new centrality measures developed in collaboration with Prof Bruno Mota.
  interested: Rodrigo Kazu Siqueira, Bruno Mota, Johnathan Cooper-Knock.
