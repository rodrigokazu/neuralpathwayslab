- title: "Spatiotemporally resolved molecular and cellular architecture of spinal cord injury"
  image:
  description: This study maps how cells and gene expression change across space and time after spinal cord injury, in mouse and human tissue. Emily Burnside leads it with Frank Bradke and Omer Bayraktar. The team used Cell2location to map an integrated single-cell atlas (167,493 cells in 18 broad cell types) onto 10x Visium sections of mouse spinal cord at 1, 3, 7, 14 and 28 days after contusion injury. Cell-cell communication analyses with MISTy and LIANA divide the injury site into a fibrotic core, a glial scar and spared grey matter, and follow macrophage and microglia subtypes through the injury response. I contributed Xenium analysis, and the manuscript is in preparation.
  interested: Emily R. Burnside, Yeliz Demirci, Jovan Tanevski, Chang Lu, Zoi Katsirea, Kenny Roberts, Guillaume P. Heger, Jimmy Lee, Rodrigo Kazu Siqueira, Elizabeth Tuck, Julio Saez-Rodriguez, Frank Bradke, Omer Bayraktar.
