- title: "PhD project proposal: oligodendrocyte gene regulatory networks in ALS"
  image:
  description: A proposed PhD project that maps the gene regulatory programmes driving oligodendrocyte dysfunction in ALS, finds their controller genes with network controllability, and locates them in human motor cortex and spinal cord with spatial transcriptomics. It builds on our multiome atlas and spatial data, in close collaboration with Manu Saraswat (DKFZ), the developer of scDoRI.
  interested: Rodrigo Kazu Siqueira, Johnathan Cooper-Knock, Manu Saraswat.
