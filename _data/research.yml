- title: "Selective pruning and neuronal death generate scale-free networks"
  image: paper3.png
  description: Inspired by the ubiquity of component loss during brain development, we propose a directed network model in which less-connected nodes and edges are selectively deleted. The resulting networks robustly display scale-invariant degree distributions without fine-tuning, as long as the network is predominantly feed-forward. This suggests neuronal and synaptic pruning during development are selective rather than random, and that preferential detachment is a general mechanism for generating scale-free networks alongside preferential attachment.
  interested: Rodrigo Kazu Siqueira, Kleber Neves, Bruno Mota.
  link:
    url: https://arxiv.org/abs/2408.02625
    display: arXiv:2408.02625 [q-bio.NC]
  highlight: 1
