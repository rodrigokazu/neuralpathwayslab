- title: "Selective pruning and neuronal death generate heavy-tailed network connectivity"
  image: netn_fig1f.png
  description: The developing brain loses many of its neurons and synapses. Our directed network model copies this by selectively deleting less-connected nodes and edges. The resulting networks show heavy-tailed degree distributions without fine-tuning, as long as the network is mostly feed-forward. This suggests that pruning of neurons and synapses during development is selective, and that preferential detachment, like preferential attachment, can generate heavy-tailed networks. We have submitted the paper to Network Neuroscience.
  interested: Rodrigo Kazu Siqueira, Kleber Neves, Bruno Mota.
  link:
    url: https://arxiv.org/abs/2408.02625
    display: arXiv:2408.02625 [q-bio.NC]
  highlight: 1
