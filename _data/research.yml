- title: "ALS multiome atlas and network controllability"
  image: als_multiome.png
  description: I lead the analysis of the largest ALS single-cell multiome atlas to date (788,330 cells across 22 cell types from the human motor cortex), jointly profiled for gene expression and chromatin accessibility. From this atlas I infer cell-type-specific gene regulatory networks (eGRNs) and apply Minimum Dominating Set (MDS) analysis to identify the smallest group of master regulators whose combined reach covers the full network. Applied to WDR49+ astrocytes, the method prioritised 54 candidates, 21% of which independently emerged as significant exome hits in the NYGC rare variant dataset. The atlas manuscript is in preparation for Nature Genetics.
  interested: Rodrigo Kazu Siqueira, Johnathan Cooper-Knock, Michael P. Snyder and collaborators.
  link:
    url: https://arxiv.org/abs/2408.02625
    display: Preprint (network method)
  highlight: 1

- title: "Molecular correlates of TDP-43 pathology in human motor neurons revealed by spatial transcriptomics"
  image: als_xenium.png
  description: I have performed spatial transcriptomic analysis of 1.2M Xenium-profiled cervical spinal cord cells from ALS and control cases, defining motor neuron pathology-enriched populations and revealing TDP-43-associated cryptic exon signatures (STMN2, UNC13A) and CCDC146 correlations within spatially resolved disease niches. A parallel dataset of the motor cortex, the first of its kind for ALS, is being generated and will be the spatial backbone of the MNDA fellowship project. These analyses feed into manuscripts in preparation for Nature Genetics and Nature.
  interested: Rodrigo Kazu Siqueira, Johnathan Cooper-Knock, Andrew Strange and collaborators, Michael P. Snyder.
  link:
