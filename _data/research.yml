- title: "scController: network controllability for single-cell and spatial omics"
  image: controller_network.jpg
  description: For my MND Association fellowship, I am building scController, an open-source Python package that finds minimum dominating sets in gene regulatory networks and in spatial cell-type co-occurrence networks from single-cell and spatial omics data. It will follow scverse conventions, and I will compare it with hub-based gene ranking. With Prof Bruno Mota I am developing new centrality measures to complement it.
  interested: Rodrigo Kazu Siqueira, Bruno Mota, Johnathan Cooper-Knock.
