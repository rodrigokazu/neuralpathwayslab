- title: "Selective pruning and neuronal death generate heavy-tailed network connectivity"
  image: netn_fig1f.png
  description: Inspired by the loss of neurons and synapses during brain development, we propose a directed network model in which less-connected nodes and edges are selectively deleted. The resulting networks show heavy-tailed degree distributions without fine-tuning, as long as the network is mostly feed-forward. This suggests that neuronal and synaptic pruning during development is selective rather than random, and that preferential detachment can generate heavy-tailed networks alongside preferential attachment. The paper has been submitted to Network Neuroscience.
  interested: Rodrigo Kazu Siqueira, Kleber Neves, Bruno Mota.
  link:
    url: https://arxiv.org/abs/2408.02625
    display: arXiv:2408.02625 [q-bio.NC]
  highlight: 1
