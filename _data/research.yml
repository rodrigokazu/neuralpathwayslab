- title: "ALS multiome atlas and network controllability"
  image: wdr49_atlas.jpg
  description: I am joint first author on a single-nucleus multiome atlas of ALS motor cortex from 70 donors, which measures gene expression and chromatin accessibility in the same nuclei. The paper is in revision at Nature Neuroscience. From this atlas I infer cell-type-specific gene regulatory networks and use minimum dominating sets to find the smallest group of controller genes that reaches every gene in a network in one step. In one 783-gene WDR49+ astrocyte programme, 27 controller genes reach every gene, while the 27 best-connected genes reach 622. An exact search shows that no smaller set exists, but other sets of 27 genes can do the same, so we treat controllers as candidates to test.
  interested: Sam Bonsall, Rodrigo Kazu Siqueira, Marianne King, Diana Leung, Johnathan Cooper-Knock, Michael P. Snyder and collaborators.
  link:
    url: https://www.researchsquare.com/article/rs-9853460/v1
    display: Preprint, Research Square rs-9853460
  highlight: 1

- title: "Spatially resolved TDP-43 pathology in amyotrophic lateral sclerosis links to neuroprotective cathepsin D activity"
  image: spinal_cord_xenium.jpg
  description: We profiled spinal cord sections from 20 donors with 10x Xenium and scored motor neurons for TDP-43 pathology on a pTDP-43 stain of the same section. Motor neurons with TDP-43 pathology carry more cathepsin D (CTSD) transcripts than motor neurons of the same size without it, and rare damaging CTSD variants raise ALS risk. Through my MND Association fellowship we will extend this to paired motor cortex and spinal cord from each donor of a new Edinburgh Brain Bank cohort, with 10x Atera whole-transcriptome imaging. The manuscript is in preparation.
  interested: Rodrigo Kazu Siqueira, Marcel Weinreich, Andrew Strange, Johnathan Cooper-Knock, Michael P. Snyder and collaborators.
