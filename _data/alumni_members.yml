- name: Manu Saraswat
  initials: MS
  info: German Cancer Research Center (DKFZ), Heidelberg, Germany. Developer of scDoRI.
  number_educ: 1
  education1: Manu Saraswat develops scDoRI, a deep learning model that infers enhancer-mediated gene regulatory networks from single-cell multiome data, and has applied it to glioblastoma. We use scDoRI to build the cell-type networks behind my controllability work, and we will work closely together on the proposed PhD project on oligodendrocytes in ALS.

- name: Sam Bonsall
  initials: SB
  info: Research Associate in Bioinformatics, SITraN, University of Sheffield, UK.
  number_educ: 1
  education1: Sam Bonsall is a Research Associate in Bioinformatics at SITraN. He is joint first author with me on the ALS motor cortex multiome atlas.

- name: Dr Kevin Kenna
  photo: Kenna.jpg
  info: Associate Professor, UMC Utrecht Brain Center, Netherlands.
  number_educ: 1
  education1: Kevin Kenna leads a group working on the genetic causes of ALS, developing methods to predict how DNA variants alter RNA and gene regulation. We work together on ALS genetics and somatic mutation analyses, and in an international working group on single-cell and spatial studies of ALS.

- name: Charlotte van Dijk
  photo: vanDijk.jpg
  info: Researcher, UMC Utrecht Brain Center, Netherlands.
  number_educ: 1
  education1: Charlotte van Dijk works in Kevin Kenna's group on genetic variants that change RNA processing in ALS-relevant cell types, including single-nucleus RNA-seq of ALS cortex. She is a co-author on the ALS motor cortex multiome atlas.

- name: Prof Eran Hornstein
  photo: Hornstein.jpg
  info: Professor, Department of Molecular Genetics, Weizmann Institute of Science, Israel.
  number_educ: 1
  education1: Eran Hornstein's lab studies the molecular basis of neurodegeneration with a focus on ALS, combining human genetics, single-cell genomics and iPS cell-derived neurons. He is senior author on our TDP-43 splicing study, accepted at Nature.

- name: Dr Mychael Lourenço
  photo: Lourenco.jpg
  info: Professor, Institute of Medical Biochemistry Leopoldo de Meis, Federal University of Rio de Janeiro, Brazil.
  number_educ: 1
  education1: Mychael Lourenço's lab studies the molecular mechanisms behind memory loss and cognitive decline in Alzheimer's disease. We co-lead a study of oligodendrocyte and OPC states in Alzheimer's disease.

- name: Dr Omer Bayraktar
  photo: Omer.jpg
  info: Group Leader, Wellcome Sanger Institute, Cambridge, UK. Former host lab.
  email: ob5@sanger.ac.uk
  number_educ: 1
  education1: Omer Bayraktar leads a research group at the Wellcome Sanger Institute that studies the nervous system with spatial transcriptomics. I was a Post-doctoral Fellow in the Bayraktar group from July 2024 to July 2025, working on Xenium spatial transcriptomics of glioblastoma tumour-associated macrophages and of spinal cord injury.

- name: Dr Kleber Neves
  photo: kleber_new.jpg
  info: Researcher and science policy professional, Serrapilheira Institute, Brazil.
  email: klebertnajr@gmail.com
  number_educ: 1
  education1: Kleber Neves has a PhD in Neurosciences from the Federal University of Rio de Janeiro and was part of the coordinating team of the Brazilian Reproducibility Initiative. He is a Board Director at ASAPBio and works at the Serrapilheira Institute in science programme management. He is co-author on the selective pruning and neuronal death network paper, submitted to Network Neuroscience.
