- name: Manu Saraswat
  initials: MS
  info: German Cancer Research Center (DKFZ), Heidelberg, Germany. Developer of scDoRI.
  number_educ: 1
  education1: Manu Saraswat develops scDoRI, a deep learning model that infers enhancer-mediated gene regulatory networks from single-cell multiome data, and has applied it to glioblastoma. We use scDoRI to build the cell-type networks behind my controllability work, and we will work closely together on the proposed PhD project on oligodendrocytes in ALS.

- name: Sam Bonsall
  initials: SB
  info: Research Associate in Bioinformatics, SITraN, University of Sheffield, UK.
  number_educ: 1
  education1: Sam Bonsall is a Research Associate in Bioinformatics at SITraN. He is joint first author with me on the ALS motor cortex multiome atlas.

- name: Prof Richard Mead
  photo: Mead.jpg
  info: Professor of Translational Neuroscience, SITraN, University of Sheffield, UK.
  number_educ: 1
  education1: Richard Mead works on finding and validating therapeutic targets for ALS/MND in cell and animal models. We work together on testing candidates from our spatial and network analyses in the lab.

- name: Dr Robin Highley
  initials: RH
  info: Clinical academic neuropathologist, SITraN, University of Sheffield, UK.
  number_educ: 1
  education1: Robin Highley is a neuropathologist who studies the neuropathology of motor neurone disease, including C9orf72-related disease. He is a co-author on our spatial and multiome studies.

- name: Dr Tobias Moll
  photo: Moll.jpg
  info: MND Association Lady Edith Wolfson Research Fellow, SITraN, University of Sheffield, UK.
  number_educ: 1
  education1: Tobias Moll studies the genetics of ALS and how disrupted membrane lipid rafts and neurotrophin signalling affect motor neurons. We work together on bringing computational findings into the wet lab.

- name: Prof Colin Smith
  photo: ColinSmith.jpg
  info: Chair of Neuropathology and Director of the Edinburgh Brain and Tissue Bank, University of Edinburgh, UK.
  number_educ: 1
  education1: Colin Smith is a clinical neuropathologist who directs the Edinburgh Brain and Tissue Bank, the Scottish centre for brain and spinal cord donation in motor neurone disease. The bank provides the motor cortex and spinal cord tissue for the 10x Atera work in my fellowship.

- name: Karina McDade
  initials: KM
  info: Senior Research Technician and Brain Bank Manager, Edinburgh Brain Bank, University of Edinburgh, UK.
  number_educ: 1
  education1: Karina McDade manages the Edinburgh Brain Bank and is preparing the tissue cores for our 10x Atera study of ALS motor cortex and spinal cord.

- name: Dr Jingtian Zhou
  photo: JingtianZhou.jpg
  info: Arc Science Fellow, Arc Institute, Palo Alto, USA.
  number_educ: 1
  education1: Jingtian Zhou's lab develops single-cell multi-omic technologies and computational tools to study gene regulatory networks in brain function and disease. Jingtian is a co-corresponding author on the ALS motor cortex multiome atlas.

- name: Diana Leung
  photo: DianaLeung.jpg
  info: Research Associate, Zhou Lab, Arc Institute, Palo Alto, USA.
  number_educ: 1
  education1: Diana Leung works on single-cell multi-omic analysis of gene regulation in the brain and is a joint first author on the ALS motor cortex multiome atlas.

- name: Dr Sai Zhang
  photo: SaiZhang.jpg
  info: Assistant Professor of Biomedical Informatics and Data Science, Yale School of Medicine, USA.
  number_educ: 1
  education1: Sai Zhang's lab builds machine learning models that combine human genetics, single-cell multiomics and clinical data to study complex diseases, including ALS. He is a co-corresponding author on the ALS motor cortex multiome atlas.

- name: Dr Kevin Kenna
  photo: Kenna.jpg
  info: Associate Professor, UMC Utrecht Brain Center, Netherlands.
  number_educ: 1
  education1: Kevin Kenna leads a group working on the genetic causes of ALS, developing methods to predict how DNA variants alter RNA and gene regulation. We work together on ALS genetics and somatic mutation analyses, and in an international working group on single-cell and spatial studies of ALS.

- name: Prof Jan Veldink
  photo: Veldink.jpg
  info: Professor of Human Neurogenetics, UMC Utrecht Brain Center, Netherlands.
  number_educ: 1
  education1: Jan Veldink studies the genetic and environmental causes of ALS and has led Project MinE, the international ALS whole-genome sequencing consortium, since 2016. Project MinE genetics underpins how we prioritise genes from our network and spatial analyses.

- name: Charlotte van Dijk
  photo: vanDijk.jpg
  info: Researcher, UMC Utrecht Brain Center, Netherlands.
  number_educ: 1
  education1: Charlotte van Dijk works in Kevin Kenna's group on genetic variants that change RNA processing in ALS-relevant cell types, including single-nucleus RNA-seq of ALS cortex. She is a co-author on the ALS motor cortex multiome atlas.

- name: Prof Eran Hornstein
  photo: Hornstein.jpg
  info: Professor, Department of Molecular Genetics, Weizmann Institute of Science, Israel.
  number_educ: 1
  education1: Eran Hornstein's lab studies the molecular basis of neurodegeneration with a focus on ALS, combining human genetics, single-cell genomics and iPS cell-derived neurons. He is senior author on our TDP-43 splicing study, accepted at Nature.

- name: Dr Mychael Lourenço
  photo: Lourenco.jpg
  info: Professor, Institute of Medical Biochemistry Leopoldo de Meis, Federal University of Rio de Janeiro, Brazil.
  number_educ: 1
  education1: Mychael Lourenço's lab studies the molecular mechanisms behind memory loss and cognitive decline in Alzheimer's disease. We co-lead a study of oligodendrocyte and OPC states in Alzheimer's disease.

- name: Dr Anna-Leigh Brown
  initials: AB
  info: Senior Research Fellow, UCL Queen Square Institute of Neurology, UK.
  number_educ: 1
  education1: Anna-Leigh Brown maps the cryptic splicing and polyadenylation changes caused by loss of TDP-43 in ALS and FTD. We meet regularly to work on motor neuron spatial analysis in ALS spinal cord.

- name: Stephen Moore
  initials: SM
  info: Department of Cellular and Molecular Medicine, University of California San Diego, USA.
  number_educ: 1
  education1: Stephen Moore works on ALS in Don Cleveland's laboratory, including cryptic STMN2 splicing in TDP-43 proteinopathies. We meet regularly to work on motor neuron segmentation and spatial analysis.

- name: Dr Geethika Arekatla
  initials: GA
  info: Research Associate, VIB-KU Leuven Center for Brain & Disease Research, Belgium.
  number_educ: 1
  education1: Geethika Arekatla works on molecular profiling of neurodegeneration, including ALS, in Ludo Van Den Bosch's laboratory. We meet regularly to work on motor neuron segmentation and spatial analysis.

- name: Dr Omer Bayraktar
  photo: Omer.jpg
  info: Group Leader, Wellcome Sanger Institute, Cambridge, UK. Former host lab.
  email: ob5@sanger.ac.uk
  number_educ: 1
  education1: Omer Bayraktar leads a research group at the Wellcome Sanger Institute focused on spatial transcriptomics of the brain and nervous system. I was a Post-doctoral Fellow in the Bayraktar group from July 2024 to July 2025, working on Xenium spatial transcriptomics of glioblastoma tumour-associated macrophages and of spinal cord injury.

- name: Kenny Roberts
  photo: KennyRoberts.jpg
  info: Senior Staff Scientist, Wellcome Sanger Institute, Cambridge, UK.
  number_educ: 1
  education1: Kenny Roberts applies imaging-based spatial methods such as Xenium to human tissue in Omer Bayraktar's group. We worked together on spatial transcriptomics studies at the Sanger Institute.

- name: Dr Kleber Neves
  photo: kleber_new.jpg
  info: Researcher and science policy professional, Serrapilheira Institute, Brazil.
  email: klebertnajr@gmail.com
  number_educ: 1
  education1: Kleber Neves has a PhD in Neurosciences from the Federal University of Rio de Janeiro and was part of the coordinating team of the Brazilian Reproducibility Initiative. He is a Board Director at ASAPBio and works at the Serrapilheira Institute in science programme management. He is co-author on the selective pruning and neuronal death network paper, submitted to Network Neuroscience.
